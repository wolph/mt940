[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list =
    py{310,311,312,313}
    lint
    pyright
    mypy
    pyrefly
    docs
    coverage
    codespell
    repo-review
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run the test suite under {basepython}
extras = tests
pass_env = FORCE_COLOR
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
commands =
    pytest --cov-report= {posargs}

# ── Lint ─────────────────────────────────────────────────────

[testenv:lint]
description = Lint and format-check with ruff
skip_install = true
deps = ruff>=0.8.4
commands =
    ruff check
    ruff format --check

# ── Type checking ────────────────────────────────────────────

[testenv:pyright]
description = Type-check with pyright
extras = tests
deps = pyright>=1.1.391
commands = pyright

[testenv:mypy]
description = Type-check with mypy
extras = tests
deps = mypy>=1.14.1
commands = mypy

[testenv:pyrefly]
description = Type-check with pyrefly
extras = tests
deps = pyrefly>=0.1
commands = pyrefly check

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build the Sphinx documentation
extras = docs
allowlist_externals = rm
commands =
    rm -vf docs/mt940.rst docs/mt940.json.rst docs/mt940.models.rst docs/mt940.parser.rst docs/mt940.processors.rst docs/mt940.tags.rst docs/mt940.utils.rst
    sphinx-apidoc --separate --module-first --output-dir docs/ mt940
    sphinx-build -W -b html -d {envtmpdir}/doctrees docs docs/html

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from the test envs and enforce the threshold
skip_install = true
deps = coverage>=7.0
depends = py{310,311,312,313}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report

# ── Misc ─────────────────────────────────────────────────────

[testenv:codespell]
description = Spell-check the source
skip_install = true
deps =
    codespell
    tomli
commands = codespell

[testenv:repo-review]
description = Review the repository structure
basepython = python3.12
skip_install = true
deps =
    sp-repo-review[cli]
    validate-pyproject
commands = repo-review --show=err
