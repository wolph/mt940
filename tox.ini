[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list =
    py{310,311,312,313,314}
    lint
    taplo
    mypy
    basedpyright
    pyright
    pyrefly
    ty
    docs
    docs-formats
    coverage
    codespell
    repo-review
    zizmor
    audit
skip_missing_interpreters = true
labels =
    test = py{310,311,312,313,314}
    check = lint, taplo, mypy, basedpyright, pyright, pyrefly, ty, codespell, repo-review, zizmor, audit

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run the test suite under {basepython}
extras = tests
pass_env = FORCE_COLOR
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
commands =
    pytest --cov-report= {posargs}

# ── Lint and formatting ──────────────────────────────────────

[testenv:lint]
description = Lint and format-check the Python sources with ruff
skip_install = true
deps = ruff>=0.16
commands =
    ruff check
    ruff format --check

[testenv:taplo]
description = Format-check and validate the TOML files with taplo
skip_install = true
deps = taplo>=0.9
commands =
    taplo fmt --check
    taplo check

# ── Type checking ────────────────────────────────────────────
# docs/conf.py is type-checked too, so every checker needs the docs extra.

[testenv:mypy]
description = Type-check with mypy
extras = tests, docs
deps = mypy>=1.18
commands =
    mypy
    mypy --python-version 3.12 docs/conf.py

[testenv:basedpyright]
description = Type-check with basedpyright
extras = tests, docs
deps = basedpyright>=1.31
# pyright resolves imports through VIRTUAL_ENV when it is set, which on CI
# is the outer environment holding only tox. Point it at this env instead.
commands = basedpyright --pythonpath {envpython}

[testenv:pyright]
description = Type-check with plain pyright, which the release gate runs
extras = tests, docs
deps = pyright>=1.1.400
# Its config is a separate file, see the basedpyright section in pyproject.
commands = pyright -p pyrightconfig.strict.json --pythonpath {envpython}

[testenv:pyrefly]
description = Type-check with pyrefly
extras = tests, docs
deps = pyrefly>=1.1
commands = pyrefly check

[testenv:ty]
description = Type-check with ty
extras = tests, docs
deps = ty
commands = ty check

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build and validate the guides, examples and complete API reference
basepython = python3.12
extras = docs, tests
# conf.py generates the canonical module pages before Sphinx reads sources.
commands =
    pytest -q --no-cov mt940_tests/test_examples.py
    python -m docs._tools.inventory
    sphinx-build -W -n --keep-going -b doctest -d {envtmpdir}/doctest docs docs/_build/doctest
    sphinx-build -W -n --keep-going -b html -d {envtmpdir}/doctrees docs docs/html
    python -m docs._tools.inventory --html docs/html
    python -m docs._tools.links docs/html

[testenv:docs-linkcheck]
description = Check external documentation links, requires network access
basepython = python3.12
extras = docs
commands =
    sphinx-build -W -n --keep-going -b linkcheck -d {envtmpdir}/doctrees docs docs/_build/linkcheck

[testenv:docs-formats]
description = Build EPUB and PDF exports, requires Tectonic on PATH
basepython = python3.12
extras = docs
allowlist_externals = tectonic
commands =
    sphinx-build -W -n --keep-going -b epub -d {envtmpdir}/epub docs docs/_build/epub
    sphinx-build -W -n --keep-going -b latex -d {envtmpdir}/latex docs docs/_build/latex
    tectonic --keep-logs --outdir docs/_build/latex docs/_build/latex/mt940.tex

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from the test envs and enforce the threshold
skip_install = true
deps = coverage>=7.0
depends = py{310,311,312,313,314}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage lcov -o {toxworkdir}/coverage.lcov
    coverage report

# ── Repository checks ────────────────────────────────────────

[testenv:codespell]
description = Spell-check the source
skip_install = true
deps =
    codespell>=2.4
    tomli
commands = codespell

[testenv:repo-review]
description = Review the repository structure
basepython = python3.12
skip_install = true
deps =
    sp-repo-review[cli]
    validate-pyproject
commands = repo-review --show=err

[testenv:zizmor]
description = Audit the GitHub Actions workflows
skip_install = true
deps = zizmor>=1.0
commands = zizmor --pedantic .github/workflows

[testenv:audit]
description = Scan the installed dependencies for known vulnerabilities
extras = tests, docs
deps = pip-audit>=2.7
commands = pip-audit
