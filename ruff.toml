# Ruff configuration. Every rule is enabled (including preview rules) and the
# exceptions below each carry the reason they exist.

target-version = 'py310'
line-length = 79
preview = true
src = ['mt940', 'mt940_tests']
exclude = ['.tox', 'test.py', '*_old.py']

[lint]
select = ['ALL']
ignore = [
    'COM812', # Trailing commas are managed by the formatter.
    'ISC001', # Implicit string concatenation is managed by the formatter.
    'D203',   # Conflicts with D211 (no blank line before a class docstring).
    'D213',   # Conflicts with D212 (summary on the first docstring line).
    'CPY001', # No per-file copyright headers, the LICENSE file covers it.
    'TRY003', # Exception messages live at the raise site, not in subclasses.
    'RUF105', # `noqa` stays readable by other tools, `ruff: ignore` is not.
    'FBT001', # Keyword-only booleans would break positional callers of the
    'FBT002', # public API (add_currency_pre_processor and friends).
    'A005',   # mt940.json shadows the stdlib json module: public module name.
]

[lint.per-file-ignores]
'mt940_tests/**' = [
    'S101',    # Tests assert.
    'PLR2004', # Magic values are the expected outputs in tests.
    'D1',      # Test names document the tests, docstrings are optional.
    'SLF001',  # Tests poke at private helpers on purpose.
    'N802',    # Test names may carry bank names such as mBank.
    'N803',
]
'mt940_tests/test_parse.py' = [
    'S301', # The pickle round-trip test deserialises its own output.
    'S403',
]
'mt940/processors.py' = [
    'N802',   # mBank_* processor names are public API.
    'N803',
    'ARG001', # Every processor shares one signature, so most of them ignore
    # at least one of the positional arguments.
]
'docs/conf.py' = [
    'INP001', # Sphinx loads conf.py as a script, not as a package module.
]

[lint.flake8-annotations]
# `*args: Any` / `**kwargs: Any` pass-through signatures are allowed. Every
# other Any is flagged.
allow-star-arg-any = true

[lint.flake8-quotes]
docstring-quotes = 'double'
inline-quotes = 'single'
multiline-quotes = 'double'

[lint.flake8-pytest-style]
mark-parentheses = true

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true

[lint.pydocstyle]
convention = 'google'
ignore-decorators = ['typing.overload', 'typing.override']

[lint.pycodestyle]
max-line-length = 79

[format]
line-ending = 'lf'
indent-style = 'space'
quote-style = 'single'
docstring-code-format = true
skip-magic-trailing-comma = false
