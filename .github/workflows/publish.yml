name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

# Read-only by default, only the publish job gets the OIDC token.
permissions:
  contents: read

# One release at a time, and never cancel a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tag pushes do not trigger ci.yml on their own; run the full suite here so
  # nothing reaches PyPI without passing tests.
  test:
    name: Test
    uses: $/.github/workflows/ci.yml

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          activate-environment: true
          # Release artifacts must never come out of a restorable cache.
          enable-cache: false
      - name: Build
        run: uv build
      - name: Check the distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # OIDC for Trusted Publishing and PEP 740 attestations.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
