name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:
  # Lets publish.yml run the full test suite as a release gate.
  workflow_call:

# Read-only by default, no job in this workflow writes to the repository.
permissions:
  contents: read

# Keyed on the ref, not the commit. A release pushes the same commit to
# develop and master at once, and keying on the sha made one run cancel the
# other, which the branch badge then reports as failing.
# The prefix is a literal on purpose. Under a workflow_call from publish.yml
# `github.workflow` expands to the caller's name, and a group equal to the
# caller's own group stopped the test gate from starting (release 5.1.1).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'

jobs:
  # tox-gh-actions maps the runner's Python to its py3xx env, so CI and a
  # local `tox` run the identical matrix.
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: uv pip install '.[tox]'
      - name: Run tests
        run: tox
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: .tox/.coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # The real coverage gate: combine every matrix cell, enforce 100% once.
  coverage:
    name: Combined coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
      - name: Install tox
        run: uv pip install '.[tox]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .tox
          merge-multiple: true
      - name: Combine coverage and enforce threshold
        run: tox -e coverage
      # Feeds the coveralls badge in the README. Branch pushes only: pull
      # requests from forks get a read-only token, and tag pushes (via
      # publish.yml) would show up on coveralls as a branch named after the tag.
      - name: Upload coverage to coveralls
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: .tox/coverage.lcov
          format: lcov

  # One cell per static check. Each is a tox env, so `tox -m check` locally
  # runs the same commands.
  check:
    name: Check ${{ matrix.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        env:
          - lint
          - taplo
          - mypy
          - basedpyright
          - pyright
          - pyrefly
          - ty
          - docs
          - docs-formats
          - codespell
          - repo-review
          - zizmor
          - audit
    env:
      TOX_ENV: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          activate-environment: true
          python-version: '3.12'
      - name: Install tox
        run: uv pip install '.[tox]'
      - name: Install the PDF engine
        if: matrix.env == 'docs-formats'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/tectonic.tar.gz" \
            'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz'
          printf '%s  %s\n' \
            '8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7' \
            "$RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tectonic-bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tectonic-bin" tectonic
          echo "$RUNNER_TEMP/tectonic-bin" >> "$GITHUB_PATH"
      - name: Run ${{ matrix.env }}
        run: tox -e "$TOX_ENV"
      - name: Upload documentation preview
        if: matrix.env == 'docs' || matrix.env == 'docs-formats'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-${{ matrix.env }}
          path: |
            docs/html
            docs/_build/epub/*.epub
            docs/_build/latex/*.pdf
          if-no-files-found: error
          retention-days: 7
